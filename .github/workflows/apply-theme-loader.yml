name: Apply NexaFlow theme loader

on:
  push:
    paths:
      - '.github/workflows/apply-theme-loader.yml'

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject theme loader into pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_files = [Path('index.html'), *sorted(Path('pages').glob('*.html'))]
          for path in html_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'js/theme.js' in text:
                  continue
              src = 'js/theme.js' if path.parent == Path('.') else '../js/theme.js'
              tag = f'  <script src="{src}"></script>\n'
              if '</body>' in text:
                  text = text.replace('</body>', tag + '</body>', 1)
                  path.write_text(text, encoding='utf-8')

          for css_path in [Path('css/empresa.css'), Path('css/agendamento-publico.css')]:
              if not css_path.exists():
                  continue
              text = css_path.read_text(encoding='utf-8')
              marker = '@import url("theme.css");'
              if marker not in text:
                  css_path.write_text(marker + '\n' + text, encoding='utf-8')
          PY

      - name: Commit theme integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "NexaFlow Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html pages css/empresa.css css/agendamento-publico.css
          git commit -m "feat: enable light and dark mode across pages"
          git push origin main
